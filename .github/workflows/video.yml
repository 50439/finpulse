name: Vertical video (TikTok / Shorts / Reels)

# Отдельный workflow, а не шаг в publish.yml — по той же причине, по которой
# генерация контента вынесена из деплоя: рендер видео не должен ни задерживать
# выкладку сайта, ни падать вместе с ней.
#
# Готовые ролики забираются во вкладке Actions → нужный прогон → Artifacts.
# Автопубликация в TikTok здесь НЕ делается: Content Posting API без аудита
# умеет постить только в приватный аккаунт в режиме SELF_ONLY, то есть в никуда.

on:
  schedule:
    # Раз в сутки, 07:10 UTC — после ночного прогона publish.yml,
    # чтобы в ролик попала уже опубликованная свежая новость.
    - cron: '10 7 * * *'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Slug конкретной статьи (пусто — самая свежая ещё не снятая)'
        required: false
      count:
        description: 'Сколько роликов сделать'
        required: false
        default: '1'
      hook:
        description: 'Крючок первого кадра руками (пусто — из article.video.hook или из заголовка)'
        required: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Test video card logic
        run: node scripts/video.test.js

      # ffmpeg и espeak-ng на раннере не предустановлены, Chrome — предустановлен.
      # espeak-ng нужен Kokoro для транскрипции текста в фонемы.
      - name: Install ffmpeg and espeak-ng
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-tts.txt

      # torch ставим из CPU-индекса: обычное колесо тянет ~2,5 ГБ ради CUDA,
      # которой на раннере всё равно нет.
      - name: Install local TTS (free, no API key)
        run: |
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet -r requirements-tts.txt

      - name: Render videos
        env:
          SLUG: ${{ inputs.slug }}
          HOOK: ${{ inputs.hook }}
          CHROME_BIN: /usr/bin/google-chrome
          # Озвучка по умолчанию локальная и бесплатная (Kokoro). Ключи нужны,
          # только если в data/tts.json переключить provider на openai/elevenlabs.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -n "${{ inputs.count }}" ] && [ "${{ inputs.count }}" != "1" ]; then
            node -e "
              const fs=require('fs'),p='data/video.json';
              const c=JSON.parse(fs.readFileSync(p,'utf8'));
              c.perRun=Number('${{ inputs.count }}')||1;
              fs.writeFileSync(p,JSON.stringify(c,null,2));
            "
          fi
          node scripts/video.js
          # Промежуточные PNG и MP3 в артефакт не кладём — это десятки мегабайт,
          # а нужны только MP4 и текст описания.
          find out/video -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
          ls -la out/video || true

      - uses: actions/upload-artifact@v4
        with:
          name: finpulse-video
          path: out/video
          retention-days: 30
          if-no-files-found: warn

      # Готовый ролик кладём в релиз с плавающим тегом video-latest. Артефакт
      # Actions скачивается только браузером с логином GitHub — сессия Claude,
      # которая публикует в TikTok, до него не дотягивается (на этом встал цикл
      # 12.09). Ссылка на ассет релиза публичная и качается обычным curl:
      # https://github.com/50439/finpulse/releases/download/video-latest/<slug>.mp4
      # Рядом latest.json — какой слаг только что отрендерен и когда.
      - name: Publish video to release video-latest
        if: hashFiles('out/video/*.mp4') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e "
            const fs=require('fs');
            const mp4=fs.readdirSync('out/video').filter(f=>f.endsWith('.mp4')).sort((a,b)=>fs.statSync('out/video/'+b).mtimeMs-fs.statSync('out/video/'+a).mtimeMs);
            const slug=mp4[0].replace(/\.mp4$/,'');
            const txt=fs.existsSync('out/video/'+slug+'.txt')?fs.readFileSync('out/video/'+slug+'.txt','utf8'):'';
            fs.writeFileSync('out/video/latest.json',JSON.stringify({slug,rendered:new Date().toISOString(),mp4:slug+'.mp4',caption:txt},null,1));
            console.log('latest:',slug);
          "
          gh release view video-latest >/dev/null 2>&1 || \
            gh release create video-latest --title "Latest TikTok video (rolling)" --notes "Обновляется каждым прогоном video.yml. Свежий ролик — см. latest.json." --latest=false
          gh release upload video-latest out/video/*.mp4 out/video/*.txt out/video/latest.json --clobber
          # В релизе держим только последние 5 роликов, чтобы он не разрастался.
          gh release view video-latest --json assets -q '.assets[].name' | grep '\.mp4$' | sort | head -n -5 | while read a; do
            gh release delete-asset video-latest "$a" -y; gh release delete-asset video-latest "${a%.mp4}.txt" -y || true
          done

      # Отметка «этот слаг уже снят» должна пережить прогон, иначе завтра
      # сделается ролик про ту же новость.
      - name: Remember what was rendered
        run: |
          git config user.name "finpulse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content/video-done.json 2>/dev/null || true
          git checkout -- data/video.json 2>/dev/null || true
          git commit -m "video: rendered $(date -u +'%Y-%m-%d')" && git push || echo "nothing to commit"
