name: Deploy files (bundle)

# Зачем: push из сессии Claude заблокирован git-прокси (открытый баг), и каждая
# выкладка требовала отдельного коммита через веб-форму на КАЖДУЮ папку —
# долго и оставляет прод в промежуточном состоянии между коммитами.
#
# Как пользоваться (одна загрузка на всю выкладку, сколько бы файлов ни было):
#   1) tar czf - build.js scripts/telegram.js data/x.json | base64 -w0 > bundle.b64
#   2) загрузить bundle.b64 в папку deploy/ через github.com/50439/finpulse/upload/main/deploy
#   3) всё: workflow сам распакует по правильным путям, прогонит сборку и тесты,
#      закоммитит файлы и удалит bundle.b64
#
# Почему файлом, а не полем формы: поле workflow_dispatch портит длинный base64
# при urlencode ('+' приезжает пробелом), а загрузка файла отдаёт байты как есть.
# Поле оставлено как запасной путь для маленьких выкладок.
#
# ОГРАНИЧЕНИЕ: файлы .github/workflows/ так залить нельзя — у GITHUB_TOKEN нет
# права workflows. Workflow говорит это сразу, а не молчаливым отказом push в конце.

on:
  push:
    branches: [main]
    paths: ['deploy/bundle.b64']
  workflow_dispatch:
    inputs:
      bundle:
        description: 'base64 от tar.gz (для больших выкладок лучше загрузить файл в deploy/bundle.b64)'
        required: false
      message:
        description: 'Сообщение коммита'
        required: false
        default: 'deploy: files via bundle'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack and validate
        env:
          BUNDLE_INPUT: ${{ inputs.bundle }}
        run: |
          set -euo pipefail
          if [ -f deploy/bundle.b64 ]; then
            SRC=deploy/bundle.b64
            echo "Источник: файл deploy/bundle.b64 ($(wc -c < deploy/bundle.b64) байт)"
          elif [ -n "${BUNDLE_INPUT:-}" ]; then
            printf '%s' "$BUNDLE_INPUT" > /tmp/input.b64
            SRC=/tmp/input.b64
            echo "Источник: поле workflow_dispatch ($(wc -c < /tmp/input.b64) байт)"
          else
            echo "Нечего разворачивать: нет ни deploy/bundle.b64, ни значения в поле bundle"
            echo "NOTHING=1" >> "$GITHUB_ENV"; exit 0
          fi

          # Терпим оба алфавита и порчу '+' -> пробел при urlencode.
          tr -d '\n\r' < "$SRC" | tr ' ' '+' | tr -- '-_' '+/' | base64 -d > /tmp/bundle.tgz 2>/dev/null || true
          if ! tar tzf /tmp/bundle.tgz > /dev/null 2>&1; then
            echo "::error::Архив не распаковывается. Ожидается вывод: tar czf - <файлы> | base64 -w0"; exit 1
          fi

          echo "Файлы в архиве:"; tar tzf /tmp/bundle.tgz | tee /tmp/list.txt

          if grep -qE '(^/|(^|/)\.\./|^\.git/)' /tmp/list.txt; then
            echo "::error::Архив содержит абсолютный путь, .. или .git/ — отказ"; exit 1
          fi
          if grep -qE '^\.github/workflows/' /tmp/list.txt; then
            echo "::error::Файлы .github/workflows/ этим способом не заливаются (у GITHUB_TOKEN нет права workflows). Используйте веб-форму загрузки GitHub."; exit 1
          fi

          tar xzf /tmp/bundle.tgz
          rm -f deploy/bundle.b64

      - name: Sanity check (сборка и тесты обязаны пройти)
        if: env.NOTHING != '1'
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://finpulse24.com' }}
        run: |
          node build.js
          node build.test.js
          node scripts/dedup.test.js
          node scripts/telegram.test.js

      - name: Commit
        if: env.NOTHING != '1'
        run: |
          git config user.name "finpulse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A          # dist уже в .gitignore, отдельный pathspec только мешал
          if git diff --cached --quiet; then
            echo "Нечего коммитить — файлы совпадают с тем, что уже в репозитории"; exit 0
          fi
          git status --short
          git commit -m "${{ inputs.message || 'deploy: files via bundle' }}"
          git push
