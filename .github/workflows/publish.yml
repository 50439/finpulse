name: Build & publish (auto-news every 6 hours)
on:
  push:
    branches: [main]
  schedule:
    # Раз в 8 часов (было 6). Вместе с ARTICLES_PER_RUN=1 это до 3 статей
    # в сутки вместо 8 — на месяц, пока сайт молодой. Вернуть: '0 */6 * * *'.
    - cron: '0 */8 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Test duplicate detection
        run: node scripts/dedup.test.js
      - name: Test telegram multi-channel routing
        run: node scripts/telegram.test.js
      # Статьи генерируем ТОЛЬКО по расписанию или вручную.
      # Раньше шаг запускался и на push: каждый коммит с правкой кода порождал
      # ещё 2 статьи. 22.08 получилось 7 прогонов вместо 4 за сутки.
      - name: Generate fresh articles (RSS -> Claude -> 17 languages)
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY secret not set - skipping article generation, publishing existing content"
          else
            node scripts/generate.js || echo "::warning::article generation failed - publishing existing content"
          fi
      # \u0412\u0435\u0447\u043d\u043e\u0437\u0435\u043b\u0451\u043d\u044b\u0435 \u0433\u0430\u0439\u0434\u044b \u2014 \u041e\u0414\u0418\u041d \u0432 \u0441\u0443\u0442\u043a\u0438 (\u0442\u043e\u043b\u044c\u043a\u043e \u043d\u0430 \u043d\u043e\u0447\u043d\u043e\u043c \u043f\u0440\u043e\u0433\u043e\u043d\u0435 00:00 UTC).
      # 12 \u0442\u0435\u043c \u0438\u0437 data/guides.json \u0440\u0430\u0441\u0442\u044f\u043d\u0443\u0442\u0441\u044f \u043d\u0430 ~12 \u0434\u043d\u0435\u0439 \u0438 \u0434\u0430\u043b\u044c\u0448\u0435 \u0448\u0430\u0433 \u0441\u0430\u043c \u0441\u0442\u0430\u043d\u0435\u0442 no-op.
      # \u041f\u0430\u0447\u043a\u0430 \u0438\u0437 12 \u0433\u0430\u0439\u0434\u043e\u0432 \u0437\u0430 \u0441\u0443\u0442\u043a\u0438 \u0432\u044b\u0433\u043b\u044f\u0434\u0438\u0442 \u043a\u0430\u043a \u0434\u0430\u043c\u043f, \u043f\u043e \u043e\u0434\u043d\u043e\u043c\u0443 \u0432 \u0434\u0435\u043d\u044c \u2014 \u043a\u0430\u043a \u0436\u0438\u0432\u043e\u0439 \u0441\u0430\u0439\u0442.
      - name: Generate evergreen guide (1/day)
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY secret not set - skipping guide generation"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%H)" -lt 8 ]; then
            node scripts/guides.js || echo "::warning::guide generation failed"
          else
            echo "not the nightly run - skipping guide generation"
          fi
      - name: Post to Telegram (all language channels)
        if: github.event_name != 'push'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL || 'https://finpulse24.com' }}
        run: |
          node scripts/telegram.js --check || true
          node scripts/telegram.js || echo "::warning::telegram posting failed"
      - name: Commit fresh content
        run: |
          git config user.name "finpulse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content/articles.json content/tg-posted.json content/guides.json 2>/dev/null || git add content/articles.json
          git commit -m "auto: fresh content $(date -u +'%Y-%m-%d %H:%M')" && git push || echo "nothing to commit"
      - name: Build site
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://finpulse24.com' }}
          BASE_PATH: ${{ vars.BASE_PATH || '' }}
        run: node build.js && node build.test.js
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: IndexNow ping (Bing/Yandex)
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://finpulse24.com' }}
        run: node scripts/indexnow.js || echo "::warning::indexnow failed"
