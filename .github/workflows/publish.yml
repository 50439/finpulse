name: Build & publish (auto-news every 6 hours)

# Два ОТДЕЛЬНЫХ job'а, и это принципиально.
#
# Раньше всё было одним job'ом под шлюзом `concurrency: pages`. Генерация гайдов
# идёт до часа — и весь этот час сайт не мог выложиться ничем другим: любая
# bundle-выкладка стояла в очереди за моделью. Хуже того, прогон #75 упал на сборке
# ПОСЛЕ генерации, и сайт не выложился вовсе, хотя контент был готов и закоммичен.
#
# Теперь шлюз `pages` висит только на job'е deploy. Пока content общается с моделью,
# выкладка сайта свободна. deploy делает свежий checkout и берёт то, что content
# успел закоммитить.

on:
  push:
    branches: [main]
    # deploy/bundle.b64 обрабатывает deploy-files.yml: он распаковывает файлы,
    # коммитит и сам публикует Pages. Если publish.yml тоже стартует на этот push,
    # он собирает ЕЩЁ СТАРЫЙ код и, финишируя вторым, затирает свежую публикацию.
    paths-ignore: ['deploy/**']
  schedule:
    # Раз в 8 часов, ЯВНЫЕ времена вместо '0 */8': GitHub привязывает */8 к
    # минуте создания workflow и сетка дрейфует. 14:44 UTC выбрано владельцем
    # (01.09) как время дневной статьи и ролика; 06:44 попадает в ночное окно
    # гайдов (до 08:00 UTC). Вместе с newsPerDay=1 это 1 статья в сутки.
    - cron: '44 6,14,22 * * *'
  workflow_dispatch:
    inputs:
      guides_per_run:
        description: 'Сколько вечнозелёных гайдов написать за этот прогон (по расписанию всегда 1)'
        required: false
        default: '1'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # ---------------------------------------------------------------- контент
  # Долгий job: ходит в модель, пишет статьи и гайды, постит в Telegram.
  # НЕ держит шлюз pages и ничего не публикует.
  content:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Test duplicate detection
        run: node scripts/dedup.test.js
      - name: Test telegram multi-channel routing
        run: node scripts/telegram.test.js
      - name: Test guide generation (JSON repair, top-up)
        run: node scripts/guides.test.js
      - name: Generate fresh articles (RSS -> Claude -> 17 languages)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY secret not set - skipping article generation"
          else
            node scripts/generate.js || echo "::warning::article generation failed - publishing existing content"
          fi
      # Вечнозелёные гайды — ОДИН в сутки (только на ночном прогоне до 08:00 UTC).
      # Пачка гайдов за сутки выглядит как дамп, по одному в день — как живой сайт.
      - name: Generate evergreen guide (1/day)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GUIDES_PER_RUN: ${{ inputs.guides_per_run || '1' }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY secret not set - skipping guide generation"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$(date -u +%H)" -lt 8 ]; then
            node scripts/guides.js || echo "::warning::guide generation failed"
          else
            echo "not the nightly run - skipping guide generation"
          fi
      - name: Post to Telegram (all language channels)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL || 'https://finpulse24.com' }}
        run: |
          node scripts/telegram.js --check || true
          node scripts/telegram.js || echo "::warning::telegram posting failed"
      - name: Commit fresh content
        run: |
          git config user.name "finpulse-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content/articles.json content/tg-posted.json content/guides.json 2>/dev/null || git add content/articles.json
          git commit -m "auto: fresh content $(date -u +'%Y-%m-%d %H:%M')" && git push || echo "nothing to commit"

  # ---------------------------------------------------------------- выкладка
  # Короткий job: собрать и опубликовать. Только он держит шлюз pages.
  # Идёт даже если content упал: контент, который тот успел закоммитить,
  # всё равно должен доехать до сайта.
  deploy:
    needs: [content]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ref: main, а не SHA прогона — нужен коммит, который только что сделал content.
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Build site
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://finpulse24.com' }}
        run: node build.js && node build.test.js
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: IndexNow ping (Bing/Yandex)
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://finpulse24.com' }}
        run: node scripts/indexnow.js || echo "::warning::indexnow failed"
